<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primo Passo</title>
  <style>
    :root { --bg:#fafaf7; --fg:#1a1a1a; --muted:#666; --card:#fff; --line:#e3e1da; --acc:#8a1c1c; --ok:#2e6b3a; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#141414; --fg:#eee; --muted:#999; --card:#1e1e1e; --line:#333; --acc:#e07a5f; --ok:#7fbf8a; }
    }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui, sans-serif; }
    header { padding:16px; border-bottom:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    header h1 { font-size:20px; margin:0 auto 0 0; }
    main { display:grid; grid-template-columns: 1fr 320px; gap:16px; padding:16px; max-width:1100px; margin:auto; }
    @media (max-width: 760px) { main { grid-template-columns: 1fr; } }
    .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
    #log { height:55vh; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
    .msg { padding:8px 12px; border-radius:10px; max-width:85%; white-space:pre-wrap; }
    .user { align-self:flex-end; background:var(--acc); color:#fff; }
    .ai { align-self:flex-start; border:1px solid var(--line); }
    .sys { align-self:center; color:var(--muted); font-size:13px; }
    form { display:flex; gap:8px; margin-top:12px; }
    input, select, button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); }
    input[type=text] { flex:1; min-width:0; }
    button.primary { background:var(--acc); color:#fff; border-color:var(--acc); }
    #steps h2 { font-size:16px; margin:0 0 8px; }
    #steps li { margin:4px 0; }
    .done { color:var(--ok); }
    .muted { color:var(--muted); font-size:13px; }
    #foglio { position:fixed; inset:0; z-index:10; background:var(--bg); display:flex; flex-direction:column; }
    #foglio .bar { display:flex; gap:8px; padding:8px 16px; border-bottom:1px solid var(--line); }
    #foglio iframe { flex:1; width:100%; border:0; background:#fff; }
  </style>
</head>
<body>
  <header>
    <h1>Primo Passo</h1>
    <select id="lang" aria-label="Lingua">
      <option value="it">Italiano</option>
      <option value="en">English</option>
      <option value="ro">Română</option>
      <option value="ar">العربية</option>
      <option value="uk">Українська</option>
      <option value="fil">Filipino</option>
      <option value="bn">বাংলা (da testare)</option>
    </select>
    <button id="voice" class="primary">🎙 Parla</button>
    <button id="text">⌨ Scrivi</button>
    <button id="stop" disabled>Fine</button>
  </header>
  <main>
    <section class="card">
      <div id="log" aria-live="polite"></div>
      <form id="chat"><input id="q" type="text" placeholder="Scrivi qui…" disabled><button disabled>Invia</button></form>
      <p class="muted">Assistente automatico: non sostituisce gli uffici. Nessun dato viene salvato.</p>
    </section>
    <aside class="card" id="steps"><h2>Il tuo percorso</h2><p class="muted">Comparirà qui.</p></aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
