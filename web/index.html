<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAF9F6">
  <title>Primo Passo</title>
  <meta name="description" content="Pino guida le persone straniere a Roma tra residenza, tessera sanitaria e permesso di soggiorno, un passo alla volta, a voce o in chat e nella loro lingua.">
  <meta property="og:title" content="Primo Passo – Pino ti guida tra le pratiche a Roma">
  <meta property="og:description" content="Residenza, tessera sanitaria e permesso di soggiorno, un passo alla volta e nella tua lingua. Nessun dato salvato.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://mancormemec-stack.github.io/primo-passo/cover.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="pino.css?v=10">
  <style>
    :root {
      --bg:#FAF9F6; --fg:#202B30; --muted:#5E6A6F; --card:#fff; --line:#ECE8E1; --input:#D9D4CB;
      --primary:#F06424; --primary-text:#B8450F; --petrol:#173F46; --peach:#FDEBDF; --ok:#2B6B53; --ok-bg:#E3F1EB;
      --warn:#8A5300; --warn-bg:#FBF0DA; --user-bg:#173F46; --user-fg:#fff;
      --shadow:0 1px 2px rgb(32 43 48 / .05), 0 4px 16px rgb(32 43 48 / .06);
      --r:18px; --spring:cubic-bezier(.34,1.4,.64,1);
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:#12191B; --fg:#F2F0EA; --muted:#B5BFC2; --card:#1A2427; --line:#2A3639; --input:#3A484C;
        --primary-text:#FF9A66; --petrol:#9FD0D6; --peach:#3A2519; --ok:#7FD6B1; --ok-bg:#183329;
        --warn:#F2C46B; --warn-bg:#3A2D12; --user-bg:#1F4E56; --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 16px rgb(0 0 0 / .25);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 "Nunito Sans", system-ui, -apple-system, "Segoe UI", "Noto Sans", "Noto Sans Arabic", "Noto Sans Bengali", sans-serif; }
    [hidden] { display:none !important; }
    button, input { font:inherit; color:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; }
    :focus-visible { outline:3px solid var(--primary); outline-offset:3px; }
    .colonna { max-width:560px; margin:0 auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom)); }
    .muted { color:var(--muted); font-size:13px; }
    .sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    .card { background:var(--card); border-radius:var(--r); padding:16px; box-shadow:var(--shadow); }
    .press { transition:transform 150ms ease-out; }
    .press:active:not(:disabled) { transform:scale(.97); }

    /* ---------- Onboarding ---------- */
    #onboarding { display:flex; flex-direction:column; gap:14px; min-height:100dvh; }
    .marchio { font-weight:800; font-size:22px; color:var(--petrol); letter-spacing:-.01em; }
    .onb-testa { display:flex; flex-direction:column; align-items:center; text-align:center; gap:4px; }
    #onb-pino .pino { height:190px; }
    #saluto { margin:0; font-size:30px; line-height:1.2; min-height:36px; color:var(--petrol); }
    #saluto span { display:inline-block; animation:entra 320ms ease-out both; }
    .onb-sub { margin:0; color:var(--muted); max-width:34ch; }
    .onb-domanda { margin:6px 0 0; font-size:18px; }
    .griglia { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:10px; }
    .tessera { display:flex; align-items:center; justify-content:flex-start; gap:8px; min-height:58px; padding:10px 12px;
      border:2px solid transparent; border-radius:16px; background:var(--card); box-shadow:var(--shadow); font-weight:700; text-align:start; }
    .tessera[aria-checked="true"] { border-color:var(--primary); background:var(--peach); }
    .tessera .bandiera { width:24px; height:24px; flex:none; border-radius:50%; object-fit:cover; border:1px solid var(--line); background:var(--surface-2, #f3f1ec); }
    .tessera .nome { flex:1; min-width:0; text-align:left; overflow-wrap:anywhere; line-height:1.2; }
    .tessera .spunta { width:22px; height:22px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; font-size:13px; opacity:0; transform:scale(.4); transition:transform 300ms var(--spring), opacity 150ms; }
    .tessera[aria-checked="true"] .spunta { opacity:1; transform:none; }
    .link { background:none; border:0; color:var(--primary-text); font-weight:700; padding:8px 0; text-decoration:underline; text-underline-offset:3px; align-self:flex-start; }
    #cerca { width:100%; padding:12px 14px; border-radius:14px; border:2px solid transparent; background:var(--card); box-shadow:var(--shadow); font-weight:600; }
    #cerca:focus-visible { border-color:var(--primary); outline:none; }
    #altre-lista { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; max-height:250px; overflow-y:auto; overscroll-behavior:contain; padding:2px; }
    #altre-lista .tessera { min-height:48px; font-weight:600; box-shadow:none; border-color:var(--line); }
    #altre-lista .tessera small { margin-inline-start:8px; font-weight:400; color:var(--muted); font-size:12px; }
    .nota { margin:0; padding:10px 12px; border-radius:12px; background:var(--warn-bg); color:var(--warn); font-size:14px; }
    .cta { margin-top:auto; min-height:54px; border:0; border-radius:999px; background:var(--primary); color:#fff; font-weight:800; font-size:17px; box-shadow:var(--shadow); transition:opacity 200ms, transform 150ms; }
    .cta:disabled { opacity:.45; }
    .freccia { display:inline-block; margin-inline-start:6px; }
    [dir="rtl"] .freccia { transform:scaleX(-1); }

    /* ---------- Conversazione ---------- */
    .barra { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
    .chip { display:inline-flex; align-items:center; gap:6px; min-height:40px; padding:6px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-weight:700; font-size:14px; }
    .palco { position:relative; display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 4px; }
    .pino-btn { position:relative; display:grid; place-items:center; width:230px; height:230px; border:0; border-radius:50%; background:none; padding:0; -webkit-tap-highlight-color:transparent; }
    .pino-btn::before { content:""; position:absolute; inset:14px; border-radius:50%; background:var(--peach); transition:transform 400ms var(--spring), opacity 300ms; }
    .pino-btn::after { content:""; position:absolute; inset:14px; border-radius:50%; border:3px solid var(--primary); opacity:0; }
    .pino-btn .pino { position:relative; height:200px; }
    .pino-btn:disabled { cursor:default; }
    .palco[data-stato="listening"] .pino-btn::after { animation:onda 1.8s ease-out infinite; }
    .palco[data-stato="thinking"] .pino-btn::before { transform:scale(.94); }
    .palco[data-stato="speaking"] .pino-btn::before { animation:battito .9s ease-in-out infinite; }
    .palco[data-stato="success"] .pino-btn::before { background:var(--ok-bg); transform:scale(1.04); }
    #didascalia { margin:0; min-height:28px; font-weight:800; font-size:18px; color:var(--petrol); text-align:center; }
    .azioni { display:flex; gap:10px; }
    .azioni button { min-height:44px; padding:8px 18px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-weight:700; box-shadow:var(--shadow); }
    .azioni button:disabled { opacity:.45; box-shadow:none; }
    #stop:not(:disabled) { border-color:#C2361B; color:#C2361B; }
    .evidenzia { outline:3px solid var(--primary); outline-offset:2px; }
    .chat { margin-top:16px; }
    #log { max-height:42vh; min-height:120px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
    .msg { padding:9px 13px; border-radius:16px; max-width:85%; white-space:pre-wrap; overflow-wrap:anywhere; animation:entra 300ms ease-out both; }
    .user { align-self:flex-end; background:var(--user-bg); color:var(--user-fg); border-end-end-radius:6px; }
    .ai { align-self:flex-start; background:var(--bg); border:1px solid var(--line); border-end-start-radius:6px; }
    .sys { align-self:center; color:var(--muted); font-size:13px; text-align:center; }
    .sys.errore { color:var(--warn); background:var(--warn-bg); padding:8px 12px; border-radius:12px; font-size:14px; }
    #chat { display:flex; gap:8px; margin-top:12px; }
    #q { flex:1; min-width:0; padding:11px 14px; border-radius:999px; border:1px solid var(--input); background:var(--card); }
    #chat button { min-height:44px; padding:8px 16px; border-radius:999px; border:0; background:var(--petrol); color:var(--bg); font-weight:700; }
    #chat :disabled { opacity:.5; }
    #steps { margin-top:16px; }
    #steps h2 { font-size:17px; margin:0 0 8px; }
    #steps h3 { font-size:15px; margin:12px 0 4px; }
    #steps ul { list-style:none; margin:0; padding:0; }
    #steps li { margin:6px 0; padding-inline-start:4px; }
    #steps li.info { color:var(--muted); font-style:italic; }
    #steps .tag { display:block; font-size:12px; font-style:normal; color:var(--muted); }
    .done { color:var(--ok); }
    .privacy { text-align:center; margin-top:16px; }
    #foglio { position:fixed; inset:0; z-index:10; background:var(--bg); display:flex; flex-direction:column; }
    #foglio .bar { display:flex; gap:8px; padding:8px 16px; border-bottom:1px solid var(--line); }
    #foglio .bar button { min-height:44px; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--card); font-weight:700; }
    #foglio iframe { flex:1; width:100%; border:0; background:#fff; }

    @keyframes entra { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @keyframes onda { from { transform:scale(1); opacity:.6; } to { transform:scale(1.25); opacity:0; } }
    @keyframes battito { 0%,100% { transform:scale(1); } 50% { transform:scale(1.04); } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation:none !important; transition-duration:1ms !important; }
    }
    html.paused *, html.paused *::before, html.paused *::after { animation-play-state:paused !important; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Nunito+Sans:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@400;700&family=Noto+Sans+Bengali:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="tema-demo.css?v=10">
  <script src="tema-demo.js?v=10" defer></script>
  <link rel="stylesheet" href="documenti.css?v=10">
  <script src="documenti.js?v=10" defer></script>
  <link rel="stylesheet" href="mappa.css?v=10">
  <script src="mappa.js?v=10" defer></script>
  <link rel="stylesheet" href="profilo.css?v=10">
  <script src="profilo.js?v=10" defer></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="theme-color" content="#FAF9F6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Primo Passo">
</head>
<body>
  <!-- Prima schermata: la lingua è obbligatoria -->
  <section id="onboarding" class="colonna" hidden aria-labelledby="onb-domanda">
    <div class="onb-testa">
      <span class="marchio">Primo Passo</span>
      <div id="onb-pino"></div>
      <h1 id="saluto"><span class="sr">Ciao!</span><span aria-hidden="true">Ciao!</span></h1>
      <p class="onb-sub" data-t="onb.sub"></p>
    </div>
    <h2 id="onb-domanda" class="onb-domanda" data-t="onb.title"></h2>
    <label class="sr" for="cerca" data-t="onb.cerca"></label>
    <input id="cerca" type="search" autocomplete="off" data-tp="onb.cerca">
    <div id="lingue" class="griglia" role="radiogroup" aria-labelledby="onb-domanda"></div>
    <div id="altre-lista" role="radiogroup" aria-labelledby="onb-domanda"></div>
    <p id="nessuna" class="muted" hidden data-t="onb.nessuna"></p>
    <p id="nota-lingua" class="nota" hidden data-t="onb.nonProvata"></p>
    <button id="avanti" class="cta press" type="button" disabled><span data-t="onb.avanti"></span><span class="freccia" aria-hidden="true">→</span></button>
    <p class="muted privacy" data-t="privacy"></p>
    <p class="muted privacy nota-trad" hidden data-t="trad.auto"></p>
  </section>

  <!-- Conversazione: Pino al centro -->
  <div id="app" class="colonna" hidden>
    <header class="barra">
      <span class="marchio">Primo Passo</span>
      <button id="lingua" class="chip press" type="button"><span aria-hidden="true">🌐</span><span id="lingua-nome"></span></button>
    </header>
    <main>
      <section class="palco" data-stato="idle">
        <button id="voice" class="pino-btn press" type="button" data-ta="parla.aria"><span id="pino"></span></button>
        <p id="didascalia" aria-live="polite"></p>
        <div class="azioni">
          <button id="text" type="button" class="press"><span aria-hidden="true">⌨ </span><span data-t="scrivi"></span></button>
          <button id="stop" type="button" class="press" disabled data-t="fine"></button>
        </div>
      </section>
      <section class="card chat">
        <div id="log" aria-live="polite"></div>
        <form id="chat"><input id="q" type="text" data-tp="placeholder" data-ta="placeholder" disabled autocomplete="off"><button disabled data-t="invia"></button></form>
      </section>
      <aside class="card" id="steps"><h2 data-t="percorso"></h2><p class="muted" data-t="percorso.vuoto"></p></aside>
    </main>
    <p class="muted privacy" data-t="privacy"></p>
    <p class="muted privacy nota-trad" hidden data-t="trad.auto"></p>
  </div>
  <script type="module" src="app.js?v=10"></script>
</body>
</html>
